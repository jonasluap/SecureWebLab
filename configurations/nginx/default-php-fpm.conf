# EXEMPLE DE LABORATOIRE, NON PRESENTE COMME TESTE DANS LE TP INITIAL.
# A installer seulement après installation de php8.4-fpm et sauvegarde.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/html;
    index index.html index.php;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }

    # Ne pas servir des fichiers cachés (sauf exceptions explicitement prévues).
    location ~ /\. {
        deny all;
    }
}
